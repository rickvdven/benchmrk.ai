<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Benchmrk kaart · Racevoorspelling · feed 1080x1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#EFEEEA;--paper:#FFFFFF;--s2:#E4E2DC;--line:#D6D3CB;--ink:#141413;--ink2:#3A3833;--muted:#6A675F;--lime:#D4F046;
--runs:#141413;--stations:#77736A;--rox:#C3BFB3;--sans:'Archivo',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:#9a978f}
body{display:flex;justify-content:center;padding:0}
.card{position:relative;width:1080px;height:1080px;background:var(--ground);color:var(--ink);font-family:var(--sans);overflow:hidden;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.wm{font-weight:800;letter-spacing:.01em;line-height:1;white-space:nowrap}
.wm span{background:var(--lime);padding:0 .08em;margin-left:.05em}
.tag{font-family:var(--mono);font-weight:600;letter-spacing:.06em;border:2px solid var(--ink);line-height:1;white-space:nowrap}
.slip{background:var(--paper);border:1px solid var(--line);border-radius:2px;box-shadow:0 1px 0 #D6D3CB,0 24px 50px rgba(20,20,19,.14)}
.dash{border-top:2px dashed #A8A498}
.title{font-weight:800;font-stretch:72%;text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.lime{background:var(--lime);color:var(--ink)}
.cta{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.strike{text-decoration:line-through;text-decoration-thickness:.08em;color:var(--muted)}
.bar{display:flex;gap:4px}
.bar i{display:block;height:100%}
</style>
</head>
<body>
<div class="card" style="padding:56px 60px 52px;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:center"><div class="wm" style="font-size:40px">BENCH<span>MRK</span></div><div class="tag" style="font-size:20px;padding:8px 12px">VOORBEELD</div></div>
  <div class="slip" style="margin-top:36px;padding:30px 44px 38px;flex:1;display:flex;flex-direction:column;justify-content:space-between">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div class="title" style="font-size:44px">Mijn racevoorspelling</div>
    </div>
    <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:baseline">
      <div style="font-size:34px;font-weight:700">sledpusher</div>
      <div class="mono" style="font-size:24px;color:var(--ink2)">Open · Men</div>
    </div>
    <div class="dash" style="margin-top:20px"></div>
    <div style="margin-top:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px">
      <div class="mono" style="font-size:168px;font-weight:600;letter-spacing:-.03em;line-height:1">1:18:41</div>
      <div style="text-align:right;padding-bottom:10px">
        <div class="mono lime" style="font-size:52px;font-weight:600;padding:0 12px;display:inline-block">96%</div>
        <div class="mono" style="font-size:22px;color:var(--ink2);margin-top:8px">kans op 1:20:00</div>
      </div>
    </div>
    <div style="margin-top:30px"><div class="bar" style="height:24px;gap:4px"><i style="flex:2544;background:var(--runs)"></i><i style="flex:1852;background:var(--stations)"></i><i style="flex:325;background:var(--rox)"></i></div><div style="display:flex;justify-content:space-between;gap:18px;margin-top:18px"><div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;align-items:center;gap:10px;font-size:25px;color:var(--ink2)"><b style="width:19px;height:19px;background:var(--runs);display:inline-block"></b>Runs 8 km</div><div class="mono" style="font-size:32px;font-weight:600">42:24</div></div><div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;align-items:center;gap:10px;font-size:25px;color:var(--ink2)"><b style="width:19px;height:19px;background:var(--stations);display:inline-block"></b>Stations</div><div class="mono" style="font-size:32px;font-weight:600">30:52</div></div><div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;align-items:center;gap:10px;font-size:25px;color:var(--ink2)"><b style="width:19px;height:19px;background:var(--rox);display:inline-block"></b>Roxzone</div><div class="mono" style="font-size:32px;font-weight:600">5:25</div></div></div></div>
  </div>
  <div class="cta lime" style="margin-top:28px;padding:24px 30px;font-size:34px;border-radius:3px"><span>Reken je eigen race door · benchmrk.ai</span><span aria-hidden="true">→</span></div>
</div>
</body>
</html>
