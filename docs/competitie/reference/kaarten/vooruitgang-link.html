<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Benchmrk kaart · Vooruitgang sinds de start · link 1200x630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#EFEEEA;--paper:#FFFFFF;--s2:#E4E2DC;--line:#D6D3CB;--ink:#141413;--ink2:#3A3833;--muted:#6A675F;--lime:#D4F046;
--runs:#141413;--stations:#77736A;--rox:#C3BFB3;--sans:'Archivo',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:#9a978f}
body{display:flex;justify-content:center;padding:0}
.card{position:relative;width:1200px;height:630px;background:var(--ground);color:var(--ink);font-family:var(--sans);overflow:hidden;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.wm{font-weight:800;letter-spacing:.01em;line-height:1;white-space:nowrap}
.wm span{background:var(--lime);padding:0 .08em;margin-left:.05em}
.tag{font-family:var(--mono);font-weight:600;letter-spacing:.06em;border:2px solid var(--ink);line-height:1;white-space:nowrap}
.slip{background:var(--paper);border:1px solid var(--line);border-radius:2px;box-shadow:0 1px 0 #D6D3CB,0 24px 50px rgba(20,20,19,.14)}
.dash{border-top:2px dashed #A8A498}
.title{font-weight:800;font-stretch:72%;text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.lime{background:var(--lime);color:var(--ink)}
.cta{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.strike{text-decoration:line-through;text-decoration-thickness:.08em;color:var(--muted)}
.bar{display:flex;gap:4px}
.bar i{display:block;height:100%}
</style>
</head>
<body>
<div class="card" style="padding:44px 52px;display:flex;flex-direction:column">

  <div class="slip" style="margin-top:26px;flex:1;display:flex;padding:30px 36px;gap:36px">
    <div style="flex:1;display:flex;flex-direction:column">
      <div class="title" style="font-size:34px">Vooruitgang sinds de start</div>
      <div style="margin-top:8px;font-size:26px;font-weight:700">kmvreter <span class="mono" style="font-weight:400;font-size:20px;color:var(--ink2);margin-left:10px">Pro · Men</span></div>
      <div style="margin-top:auto;display:flex;gap:20px;align-items:flex-end">
        <div class="mono lime" style="font-size:104px;font-weight:600;letter-spacing:-.04em;line-height:1;padding:10px 14px 6px">−3:12</div>
        <div class="mono" style="font-size:22px;line-height:1.35;padding-bottom:6px"><span class="strike">1:22:05</span><br><span style="font-weight:600;font-size:32px">1:18:53</span></div>
      </div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;border-left:2px dashed #A8A498;padding-left:36px">
      <svg width="430" height="184" viewBox="0 -6.800000000000001 430 184" role="img" aria-label="Voorspelde eindtijd per week: van 1:22:05 in week 1 naar 1:18:53 in week 9">
  <polygon points="0,150 0.0,135.0 53.8,120.0 107.5,102.0 161.2,90.0 215.0,63.0 268.8,48.0 322.5,36.0 376.2,27.0 430.0,19.8 430,150" fill="#E4E2DC"/>
  <line x1="0" y1="60.0" x2="430" y2="60.0" stroke="#141413" stroke-width="2" stroke-dasharray="8 8"/>
  <polyline points="0.0,135.0 53.8,120.0 107.5,102.0 161.2,90.0 215.0,63.0 268.8,48.0 322.5,36.0 376.2,27.0 430.0,19.8" fill="none" stroke="#141413" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="423.5" y="13.3" width="13.0" height="13.0" fill="#D4F046" stroke="#141413" stroke-width="2"/>
  <text x="4" y="52.4" font-family="IBM Plex Mono" font-size="17" fill="#3A3833">doel 1:20:00</text>
  <text x="0" y="173.8" font-family="IBM Plex Mono" font-size="17" fill="#6A675F">wk 1</text>
  <text x="430" y="173.8" text-anchor="end" font-family="IBM Plex Mono" font-size="17" fill="#6A675F">wk 9</text>
</svg>
      <div class="cta lime" style="padding:18px 20px;font-size:26px;border-radius:3px;line-height:1.15"><span>Reken je eigen race door · benchmrk.ai</span></div>
    </div>
  </div>
</div>
</body>
</html>
