<style>
:root{--ground:#EFEEEA;--paper:#FFFFFF;--s2:#E4E2DC;--line:#D6D3CB;--ink:#141413;--ink2:#3A3833;--muted:#6A675F;--lime:#D4F046;
--runs:#141413;--stations:#77736A;--rox:#C3BFB3;--sans:'Archivo',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:#9a978f}
body{display:flex;justify-content:center;padding:0}
.card{position:relative;width:1080px;height:1920px;background:var(--ground);color:var(--ink);font-family:var(--sans);overflow:hidden;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

.tag{font-family:var(--mono);font-weight:600;letter-spacing:.06em;border:2px solid var(--ink);line-height:1;white-space:nowrap}
.slip{background:var(--paper);border:1px solid var(--line);border-radius:2px;box-shadow:0 1px 0 #D6D3CB,0 24px 50px rgba(20,20,19,.14)}
.dash{border-top:2px dashed #A8A498}
.title{font-weight:800;font-stretch:72%;text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.lime{background:var(--lime);color:var(--ink)}
.cta{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.strike{text-decoration:line-through;text-decoration-thickness:.08em;color:var(--muted)}
.bar{display:flex;gap:4px}
.bar i{display:block;height:100%}
</style>
</head>
