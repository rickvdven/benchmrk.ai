<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Benchmrk kaart · Challenge PR / top 10 · story 1080x1920</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#EFEEEA;--paper:#FFFFFF;--s2:#E4E2DC;--line:#D6D3CB;--ink:#141413;--ink2:#3A3833;--muted:#6A675F;--lime:#D4F046;
--runs:#141413;--stations:#77736A;--rox:#C3BFB3;--sans:'Archivo',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:#9a978f}
body{display:flex;justify-content:center;padding:0}
.card{position:relative;width:1080px;height:1920px;background:var(--ground);color:var(--ink);font-family:var(--sans);overflow:hidden;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.wm{font-weight:800;letter-spacing:.01em;line-height:1;white-space:nowrap}
.wm span{background:var(--lime);padding:0 .08em;margin-left:.05em}
.tag{font-family:var(--mono);font-weight:600;letter-spacing:.06em;border:2px solid var(--ink);line-height:1;white-space:nowrap}
.slip{background:var(--paper);border:1px solid var(--line);border-radius:2px;box-shadow:0 1px 0 #D6D3CB,0 24px 50px rgba(20,20,19,.14)}
.dash{border-top:2px dashed #A8A498}
.title{font-weight:800;font-stretch:72%;text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.lime{background:var(--lime);color:var(--ink)}
.cta{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.strike{text-decoration:line-through;text-decoration-thickness:.08em;color:var(--muted)}
.bar{display:flex;gap:4px}
.bar i{display:block;height:100%}
</style>
</head>
<body>
<div class="card" style="padding:240px 72px 280px;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:center"><div class="wm" style="font-size:52px">BENCH<span>MRK</span></div><div class="tag" style="font-size:24px;padding:10px 14px">VOORBEELD</div></div>
  <div class="slip" style="margin-top:44px;transform:rotate(0.4deg);padding:0 0 52px;flex:1;display:flex;flex-direction:column;justify-content:space-between">
    <div style="padding:44px 52px 30px">
      <div class="title" style="font-size:60px">Challenge week 44</div>
      <div class="mono" style="margin-top:14px;font-size:30px;color:var(--ink2)">1 km tijdrit</div>
    </div>
    <div class="dash" style="margin:0 52px"></div>
    <div style="padding:30px 52px 0;display:flex;justify-content:space-between;align-items:baseline">
      <div style="font-size:46px;font-weight:700">lunge_lotte</div>
      <div class="mono" style="font-size:30px;color:var(--ink2)">Open · Women</div>
    </div>
    <div class="mono" style="padding:20px 52px 0;font-size:240px;font-weight:600;letter-spacing:-.04em;line-height:1">3:58</div>
    <div style="padding:30px 52px 0;display:flex;gap:18px;flex-wrap:wrap">
      <div class="lime" style="font-size:44px;font-weight:800;font-stretch:80%;text-transform:uppercase;padding:12px 20px">Persoonlijk record</div>
      <div class="lime" style="font-size:44px;font-weight:800;font-stretch:80%;text-transform:uppercase;padding:12px 20px">Top 10 · Plaats 4</div>
    </div>
    <div class="mono" style="padding:30px 52px 0;font-size:36px;display:flex;justify-content:space-between">
      <span style="color:var(--ink2)">vorige</span><span class="strike">4:09</span>
    </div>
  </div>
  <div style="margin-top:44px">
    <div class="cta lime" style="padding:34px 40px;font-size:44px;border-radius:3px"><span>Doe deze week mee</span><span aria-hidden="true">→</span></div>
    <div class="mono" style="margin-top:20px;font-size:28px;display:flex;justify-content:space-between"><span>Reken je eigen race door · benchmrk.ai</span><span style="color:var(--muted)">/k/C44L</span></div>
  </div>
</div>
</body>
</html>
